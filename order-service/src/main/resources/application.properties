spring.application.name=order-service
spring.datasource.url=jdbc:mysql://localhost:3306/order_service?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=mysql
spring.jpa.hibernate.ddl-auto=none
server.port=8081
openapi.gateway.docs-access-token=${OPENAPI_GATEWAY_DOCS_ACCESS_TOKEN:local-gateway-docs-token}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false
inventory.grpc.host=localhost
inventory.grpc.port=9095
server.error.include-message=always

# Write application logs inside this service folder.
logging.file.name=logs/order-service.log

# Record every HTTP request handled by embedded Tomcat.
server.tomcat.basedir=.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%t %a "%r" %s %b %D

# Target your Docker Kafka container
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.template.default-topic=order-placed
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false


logging.level.org.springframework=DEBUG
logging.level.org.springframework.kafka=DEBUG
