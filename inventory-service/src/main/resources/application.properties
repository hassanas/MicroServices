debug=true

spring.application.name=inventory-service
server.port=8082
openapi.gateway.docs-access-token=${OPENAPI_GATEWAY_DOCS_ACCESS_TOKEN:local-gateway-docs-token}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432/inventory_service
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

grpc.server.port=9095

# Write application logs inside this service folder.
logging.file.name=logs/inventory-service.log

# Record every HTTP request handled by embedded Tomcat.
server.tomcat.basedir=.
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.buffered=false
server.tomcat.accesslog.directory=logs
server.tomcat.accesslog.prefix=access
server.tomcat.accesslog.suffix=.log
server.tomcat.accesslog.pattern=%t %a "%r" %s %b %D

