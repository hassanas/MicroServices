spring.application.name=notification-service
server.port=8083

# Application log
logging.file.name=logs/notification-service.log
logging.level.org.springframework.kafka=DEBUG
logging.level.com.vaimo.microservices.notification=DEBUG

# Mail Properties
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=0bc80544f208ad
spring.mail.password=745da92213b764


# kafka consumer properties
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-consumer-v4
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.vaimo.microservices.notification.order.OrderPlacedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false

